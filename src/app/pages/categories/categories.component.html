<div class="page-wrapper">
  <div class="page-icon">
    <span class="material-icons">person</span>
  </div>
  <h2 class="page-title">CategoryList</h2>

  <div class="table-toolbar">
    <div class="toolbar-left">
      <label>Show <input type="number" [(ngModel)]="showEntries" (ngModelChange)="resetPage()" class="entries-input" min="5" max="100"/> entries</label>
    </div>
    <div class="toolbar-right">
      <div class="icon-action-group">
        <button class="btn-icon-round" title="Attach"><span class="material-icons">attach_file</span></button>
        <button class="btn-icon-round" title="Upload"><span class="material-icons">cloud_upload</span></button>
        <button class="btn-icon-round" title="Download"><span class="material-icons">cloud_download</span></button>
        <button class="btn-icon-round" title="Report"><span class="material-icons">description</span></button>
        <button class="btn-icon-round add-btn" (click)="openAddModal()" title="Add Category">
          <span class="material-icons">add</span>
        </button>
      </div>
      <div class="search-group">
        <label>Search:</label>
        <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="scheduleSearch()" class="table-search"/>
      </div>
    </div>
  </div>

  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>No <span class="sort-icon">↑</span></th>
          <th>Action</th>
          <th>Active</th>
          <th>Category Image</th>
          <th>Category Name</th>
          <th>Created By</th>
          <th>Created at</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of pagedCategories; let index = index">
          <td>{{ pageStart + index + 1 }}</td>
          <td>
            <div class="action-btns">
              <button class="btn-edit"><span class="material-icons" style="font-size:14px">edit</span></button>
              <button class="btn-danger" (click)="deleteCategory(c)"><span class="material-icons" style="font-size:14px">close</span></button>
            </div>
          </td>
          <td>
            <label class="toggle-switch">
              <input type="checkbox" [checked]="c.active" (change)="toggleActive(c)"/>
              <span class="slider"></span>
            </label>
          </td>
          <td>
            <div class="cat-img-box">
              <span *ngIf="!c.categoryImage" class="material-icons img-placeholder-icon">image</span>
              <img *ngIf="c.categoryImage" [src]="c.categoryImage" class="cat-img"/>
            </div>
          </td>
          <td>{{ c.categoryName | firstCaps }}</td>
          <td>{{ c.createdBy | firstCaps }}</td>
          <td>{{ c.createdAt }}</td>
        </tr>
        <tr *ngIf="filtered.length === 0">
          <td colspan="7" class="empty-row">No categories found</td>
        </tr>
      </tbody>
    </table>
    <div class="table-footer">
      <app-pagination [total]="filtered.length" [pageSize]="showEntries" [(page)]="currentPage"></app-pagination>
    </div>
  </div>
</div>

<!-- Add Category Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-icon">
      <span class="material-icons">person</span>
    </div>
    <div class="modal-header-row">
      <h3>Add Category</h3>
      <button class="modal-close-btn" (click)="closeModal()">
        <span class="material-icons">close</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-left">
        <div class="modal-field">
          <label>Category Name <span class="req">*</span></label>
          <input type="text" [(ngModel)]="modalData.categoryName"/>
        </div>
        <div class="modal-field">
          <label>SAP Code <span class="req">*</span></label>
          <input type="text" [(ngModel)]="modalData.sapCode"/>
        </div>
      </div>
      <div class="modal-right">
        <div class="modal-img-box">
          <div class="img-placeholder-modal">
            <span class="material-icons img-icon-modal">image</span>
          </div>
          <button class="btn-edit-img"><span class="material-icons">edit</span></button>
        </div>
        <p class="img-label">Category Image</p>
        <button class="btn-submit-modal" (click)="submitCategory()">SUBMIT</button>
      </div>
    </div>
  </div>
</div>
