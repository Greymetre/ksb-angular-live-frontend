<div class="login-page">
  <section class="login-left" aria-label="KSB, AAROH and VRiDDHi">
    <!-- An img, not a CSS background: the CRM is served under /FieldKonnect/, and the
         template resolves the path against that base while a stylesheet would not. -->
    <img src="assets/img/app-backdrop.jpg" alt="" class="login-backdrop" />
    <div class="login-brands">
      <img src="assets/img/ksb-logo-data.svg" alt="KSB" class="ksb-hero" />
      <div class="app-logos">
        <img src="assets/img/aaroh_logo.png" alt="AAROH" class="app-logo" />
        <img src="assets/img/vriddhi_logo.png" alt="VRiDDHi" class="app-logo vriddhi" />
      </div>
    </div>
  </section>

  <section class="login-right">
    <div class="brand-lockup">
      <img src="assets/img/aaroh_logo.png" alt="AAROH" class="brand-logo" />
      <span class="brand-divider"></span>
      <img src="assets/img/vriddhi_logo.png" alt="VRiDDHi" class="brand-logo vriddhi" />
    </div>

    <div class="login-card">
      <div class="card-header">
        <img src="assets/img/ksb-logo-data.svg" alt="KSB" class="ksb-logo" />
        <p class="login-subtitle">{{ subtitle }}</p>
      </div>

      <div *ngIf="errorMessage" class="alert error-alert" role="alert" aria-live="assertive">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert success-alert" role="status" aria-live="polite">
        {{ successMessage }}
      </div>

      <form *ngIf="mode === 'login'" [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
        <div class="field-group">
          <label for="username">Email address</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Enter email"
            autocomplete="username"
            [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          />
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-control">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Password"
              autocomplete="current-password"
              [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              [title]="showPassword ? 'Hide' : 'Show'"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div class="form-links">
          <button type="button" class="link-btn" (click)="openForgotPassword()">Forgot password?</button>
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <form *ngIf="mode === 'forgot'" [formGroup]="forgotForm" (ngSubmit)="onRequestCode()" novalidate>
        <p class="form-note">Enter the email address on your account. We will send you a 6-digit code to reset your password.</p>

        <div class="field-group">
          <label for="reset-email">Email address</label>
          <input
            id="reset-email"
            type="email"
            formControlName="email"
            placeholder="Enter email"
            autocomplete="email"
            [class.invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
          />
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">
          {{ loading ? 'Sending code...' : 'Send code' }}
        </button>

        <div class="form-links centered">
          <button type="button" class="link-btn" (click)="backToLogin()">Back to login</button>
        </div>
      </form>

      <form *ngIf="mode === 'reset'" [formGroup]="resetForm" (ngSubmit)="onResetPassword()" novalidate>
        <p class="form-note">Code sent to <strong>{{ resetEmail }}</strong>. It expires in 15 minutes.</p>

        <div class="field-group">
          <label for="reset-code">6-digit code</label>
          <input
            id="reset-code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            formControlName="code"
            placeholder="Enter code"
            autocomplete="one-time-code"
            (input)="resetForm.patchValue({ code: onlyDigits($any($event.target).value) })"
            [class.invalid]="resetForm.get('code')?.invalid && resetForm.get('code')?.touched"
          />
        </div>

        <div class="field-group">
          <label for="new-password">New password</label>
          <div class="password-control">
            <input
              id="new-password"
              [type]="showNewPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              [class.invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="toggleNewPasswordVisibility()"
              [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'"
              [title]="showNewPassword ? 'Hide' : 'Show'"
            >
              {{ showNewPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div class="field-group">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Re-enter new password"
            autocomplete="new-password"
            [class.invalid]="passwordsMismatch || (resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched)"
          />
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">
          {{ loading ? 'Resetting...' : 'Reset password' }}
        </button>

        <div class="form-links spread">
          <button type="button" class="link-btn" (click)="onRequestCode()" [disabled]="loading">Send a new code</button>
          <button type="button" class="link-btn" (click)="backToLogin()">Back to login</button>
        </div>
      </form>
    </div>

    <div class="login-footer">&copy; 2025 Field Konnect. All rights reserved</div>
  </section>
</div>
